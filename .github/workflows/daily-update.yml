name: daily-update

on:
  schedule:
    # Once a day at 22:40 UTC (06:40 WITA). Each run re-fetches the last
    # 3 days, so one missed run never leaves a gap.
    - cron: "40 22 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Days to fetch, ending today UTC (for longer history use the backfill workflow)"
        default: "3"

permissions:
  contents: write   # commits data/fire_hotspots.csv back to the repo

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch fire detections from NASA FIRMS
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python fetch_firms.py --days "${{ github.event.inputs.days || '3' }}"
      
      - name: Fetch air quality from Open-Meteo
        continue-on-error: true
        run: python fetch_openmeteo.py

      - name: Fetch weather from Open-Meteo
        continue-on-error: true
        run: python fetch_weather.py
    
        
      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new rows to commit"
          else
            git commit -m "data: update fire hotspots"
            git push
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Load into BigQuery
        env:
          BQ_PROJECT: ${{ secrets.BQ_PROJECT }}
        run: python load_to_bigquery.py

      - name: Load air quality into BigQuery
        env:
          BQ_PROJECT: ${{ secrets.BQ_PROJECT }}
        run: python load_air_quality.py

      - name: Load weather into BigQuery
        env:
          BQ_PROJECT: ${{ secrets.BQ_PROJECT }}
        run: python load_weather.py
